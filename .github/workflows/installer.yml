name: Installer

# Compiles the Windows installer of the personal FireDragon build
# (installer/AuroraFD.iss, docs/INSTALLER.md) with Inno Setup. The installer
# holds no viewer program and no private code: it builds the public fork on
# the user's PC. Runs on the fork only, never on the upstream repository.
#
# - by hand (Actions > Installer > Run workflow): the installer is kept as
#   the run's artifact;
# - a tag installer-v<version> (installer-v1.0.0): the same, and the
#   installer is published as the release "Installer <version>".
on:
  workflow_dispatch:
  push:
    tags: ['installer-v*']

permissions:
  contents: write

concurrency:
  group: installer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  installer:
    if: github.repository == 'ChromeHowl/Aurora-Viewer-1'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # the engine runs in Windows PowerShell 5.1 on the users' PCs
      - name: PowerShell scripts parse (5.1)
        shell: powershell
        run: ./scripts/check-scripts.ps1
      - name: Inno Setup
        shell: pwsh
        run: |
          # installs it when the image has none, updates an older one
          # (the script needs Inno Setup 6.3 or newer)
          choco upgrade innosetup -y --no-progress
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe" -ErrorAction SilentlyContinue |
              Select-Object -First 1
          if (-not $iscc) { throw 'ISCC.exe not found after the installation of Inno Setup.' }
          "ISCC=$($iscc.FullName)" >> $env:GITHUB_ENV
      - name: Compile
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          # the installer's own version: the tag's, or 0.0.<run> by hand
          $version = "0.0.$env:RUN_NUMBER"
          if ($env:REF_TYPE -eq 'tag') {
              if ($env:REF_NAME -notmatch '^installer-v(\d+\.\d+\.\d+)$') { throw "Expected a tag installer-v<major>.<minor>.<patch>, got $env:REF_NAME." }
              $version = $Matches[1]
          }
          # the engine and the installer name the same folders
          $folder = (Get-Content installer/engine/settings.json -Raw | ConvertFrom-Json).folderName
          if (-not (Select-String -Path installer/AuroraFD.iss -SimpleMatch "#define AppFolder `"$folder`"" -Quiet)) {
              throw "AppFolder in installer/AuroraFD.iss differs from folderName ($folder) in installer/engine/settings.json."
          }
          $env:INSTALLER_VERSION = $version
          "INSTALLER_VERSION=$version" >> $env:GITHUB_ENV
          & $env:ISCC installer/AuroraFD.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-ChildItem installer/output
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: FireDragonAurora-Setup-${{ env.INSTALLER_VERSION }}
          path: installer/output/FireDragonAurora-Setup.exe
          if-no-files-found: error
      - name: Publish the release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          $exe = 'installer/output/FireDragonAurora-Setup.exe'
          $notes = @(
              'Windows installer of FireDragon Aurora, a personal build of Aurora Viewer (not an official Aurora Viewer release).'
              ''
              'It contains no viewer program: run it, and it installs the build tools (it asks first), downloads the public code of this fork, builds the viewer on your PC (20-60 minutes the first time) and installs it. "Update FireDragon Aurora" in the Start menu gets the latest version the same way.'
              ''
              'See docs/INSTALLER.md.'
          ) -join "`n"
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
              gh release upload $env:TAG $exe --clobber
          } else {
              gh release create $env:TAG $exe --title "Installer $env:INSTALLER_VERSION" --notes $notes --latest=false
          }
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
